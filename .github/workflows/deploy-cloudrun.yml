# Deploy geeves.life beta to Google Cloud Run on every push to main.
# Auth: Service Account JSON key stored as GitHub secret GCP_SA_KEY
# Secrets: all sensitive values live in GCP Secret Manager, injected at runtime.
name: Deploy beta → Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  AR_REPO: geeves
  SERVICE: geeves-beta

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Authenticate to GCP via SA JSON key ───────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ── Build & push Docker image to Artifact Registry ────────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build --no-cache -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # ── Deploy to Cloud Run (secrets injected from Secret Manager) ────────────
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 300 \
            --cpu-boost \
            --service-account "geeves-beta-runtime@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --add-cloudsql-instances "geeves-495802:us-east4:geeves-primary" \
            --set-env-vars "NODE_ENV=production,APP_URL=https://beta.geeves.life,VITE_APP_URL=https://beta.geeves.life,VITE_APP_ID=8LgLCZ74b6FfUR3gEypAGn,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},GCP_REGION=${{ env.GCP_REGION }},GCS_BUCKET_NAME=geeves-beta-assets,GUARDIAN_ENABLED=true,GUARDIAN_ALERT_EMAIL=tarik@geeves.life,SHADOW_BLOCK_ENGINE_ENABLED=false,OAUTH_SERVER_URL=https://api.manus.im,VITE_OAUTH_PORTAL_URL=https://manus.im,OWNER_OPEN_ID=2YNW5JU2M9QRFrtoji25eH,OWNER_NAME=Geeves Life,VITE_APP_TITLE=Geeves.Life,VITE_APP_LOGO=https://files.manuscdn.com/user_upload_by_module/web_dev_logo/310519663831846424/dWnKWhNrwloEwdzY.png,VITE_ANALYTICS_ENDPOINT=https://manus-analytics.com,VITE_ANALYTICS_WEBSITE_ID=aaee961b-8ffc-4da9-a469-95b3fa417160,CLOUD_SQL_CONNECTION_NAME=geeves-495802:us-east4:geeves-primary" \
            --set-secrets "DATABASE_URL=geeves-beta-database-url:latest,EDIT_SECRET=geeves-live-edit-secret:latest,SYSTEM_CRON_SECRET=geeves-live-cron-secret:latest,JWT_SECRET=geeves-live-jwt-secret:latest,RESEND_API_KEY=geeves-live-resend-api-key:latest,GOOGLE_CLIENT_ID=geeves-google-client-id:latest,GOOGLE_CLIENT_SECRET=geeves-google-client-secret:latest,GOOGLE_APPLICATION_CREDENTIALS_JSON=geeves-gcs-credentials:latest"

      # ── Smoke test ────────────────────────────────────────────────────────────
      - name: Smoke check /api/health
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1
