# One-time workflow to create GCP Secret Manager secrets using the deployer SA.
# Run manually once, then delete this file.
name: Create GCP Secrets (one-time setup)
on:
  workflow_dispatch:
env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
jobs:
  create-secrets:
    name: Create secrets in Secret Manager
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Create secrets and grant access
        env:
          DATABASE_URL: ${{ secrets.GEEVES_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.GEEVES_RESEND_API_KEY }}
          EDIT_SECRET: ${{ secrets.GEEVES_EDIT_SECRET }}
          CRON_SECRET: ${{ secrets.GEEVES_CRON_SECRET }}
          JWT_SECRET: ${{ secrets.GEEVES_JWT_SECRET }}
        run: |
          PROJECT="${{ env.GCP_PROJECT_ID }}"
          BETA_SA="geeves-beta-runtime@${PROJECT}.iam.gserviceaccount.com"
          LIVE_SA="geeves-live-runtime@${PROJECT}.iam.gserviceaccount.com"

          create_secret() {
            local NAME=$1
            local VALUE=$2
            echo "Creating $NAME..."
            gcloud secrets create "$NAME" --project="$PROJECT" --replication-policy="automatic" 2>/dev/null || echo "  (already exists)"
            echo -n "$VALUE" | gcloud secrets versions add "$NAME" --data-file=- --project="$PROJECT"
            echo "  OK: $NAME"
          }

          create_secret "geeves-live-database-url"   "$DATABASE_URL"
          create_secret "geeves-live-edit-secret"    "$EDIT_SECRET"
          create_secret "geeves-live-cron-secret"    "$CRON_SECRET"
          create_secret "geeves-live-jwt-secret"     "$JWT_SECRET"
          create_secret "geeves-live-resend-api-key" "$RESEND_API_KEY"

          ALL_SECRETS=(
            geeves-live-database-url
            geeves-live-edit-secret
            geeves-live-cron-secret
            geeves-live-jwt-secret
            geeves-live-resend-api-key
            geeves-google-client-id
            geeves-google-client-secret
            geeves-gcs-credentials
          )

          echo "Granting IAM access..."
          for SECRET in "${ALL_SECRETS[@]}"; do
            for SA in "$BETA_SA" "$LIVE_SA"; do
              gcloud secrets add-iam-policy-binding "$SECRET" \
                --project="$PROJECT" \
                --member="serviceAccount:${SA}" \
                --role="roles/secretmanager.secretAccessor" \
                --quiet 2>/dev/null && echo "  $SECRET → $SA: OK" || echo "  $SECRET → $SA: SKIPPED"
            done
          done
          echo "All secrets created and access granted."
