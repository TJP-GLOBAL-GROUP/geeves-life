# PROMOTE to LIVE — manual, approval-gated via the GitHub "live" environment.
# Deploys the SAME image digest beta is running (never a fresh build), so live
# ships exactly what was proven on beta. Input: the beta image tag (git SHA),
# defaulting to the latest successful beta deploy.
name: Promote to LIVE (approval-gated)
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git SHA of the tested beta build (leave blank = current main)'
        required: false
        default: ''

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  AR_REPO: geeves
  BETA_SERVICE: geeves-beta
  LIVE_SERVICE: geeves-live

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: live   # ← protection rule: requires tarikjp approval
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve image tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.sha }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          SRC="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPO/$BETA_SERVICE:$TAG"
          # verify the tested image exists before promoting
          gcloud artifacts docker images describe "$SRC" >/dev/null
          echo "Promoting $SRC"
        id: img

      - name: Re-tag tested image for live
        run: |
          SRC="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPO/$BETA_SERVICE:${{ steps.img.outputs.tag }}"
          DST="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPO/$LIVE_SERVICE:${{ steps.img.outputs.tag }}"
          gcloud artifacts docker tags add "$SRC" "$DST"

      - name: Deploy to Cloud Run (LIVE)
        run: |
          gcloud run deploy $LIVE_SERVICE \
            --image "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPO/$LIVE_SERVICE:${{ steps.img.outputs.tag }}" \
            --region "$GCP_REGION" --platform managed --allow-unauthenticated \
            --port 8080 --memory 1Gi --min-instances 1 --max-instances 5 \
            --service-account "$LIVE_SERVICE-runtime@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --set-env-vars "NODE_ENV=production,APP_URL=https://geeves.life,VITE_APP_URL=https://geeves.life,VITE_APP_ID=8LgLCZ74b6FfUR3gEypAGn,GCP_PROJECT_ID=$GCP_PROJECT_ID,GCP_REGION=$GCP_REGION,GCS_BUCKET_NAME=geeves-live-uploads,OAUTH_SERVER_URL=https://api.manus.im,GUARDIAN_ENABLED=true,GUARDIAN_ALERT_EMAIL=tarik@geeves.life" \
            --set-secrets "DATABASE_URL=geeves-live-database-url:latest,EDIT_SECRET=geeves-live-edit-secret:latest,SYSTEM_CRON_SECRET=geeves-live-cron-secret:latest,JWT_SECRET=geeves-live-jwt-secret:latest,RESEND_API_KEY=geeves-live-resend-api-key:latest,GOOGLE_APPLICATION_CREDENTIALS_JSON=geeves-gcs-credentials:latest,GOOGLE_CLIENT_ID=geeves-google-client-id:latest,GOOGLE_CLIENT_SECRET=geeves-google-client-secret:latest"

      - name: Smoke check
        run: |
          URL=$(gcloud run services describe $LIVE_SERVICE --region $GCP_REGION --format='value(status.url)')
          curl -fsS "$URL/api/health" | grep '"ok":true'
