<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geeves Invoice Capture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .header img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
    }
    .header .version {
      font-size: 10px;
      color: #64748b;
      margin-left: auto;
    }
    .status-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-card .label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .status-card .value {
      font-size: 13px;
      font-weight: 500;
    }
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.connected { background: #22c55e; }
    .status-dot.disconnected { background: #ef4444; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-card .number {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
    }
    .stat-card .label {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    .btn-secondary:hover { background: #334155; }
    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: #64748b;
      font-size: 12px;
    }
    .empty-state svg {
      margin-bottom: 8px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon48.png" alt="Geeves">
    <h1>Geeves Invoice Capture</h1>
    <span class="version">v1.0.0</span>
  </div>

  <div id="auth-status" class="status-card">
    <div class="label">Connection</div>
    <div class="value">
      <span class="status-indicator">
        <span class="status-dot disconnected" id="status-dot"></span>
        <span id="status-text">Checking...</span>
      </span>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="number" id="pending-count">—</div>
      <div class="label">Pending Orders</div>
    </div>
    <div class="stat-card">
      <div class="number" id="captured-count">—</div>
      <div class="label">Captured Today</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="open-categorizer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="9" y1="21" x2="9" y2="9"/>
      </svg>
      Open Categorizer
    </button>
    <button class="btn btn-secondary" id="open-walmart">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      Go to Walmart Orders
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
