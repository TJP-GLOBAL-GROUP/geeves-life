<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{REPORT_TITLE}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px; line-height: 1.7; color: #1a1a2e; background: #f5f6fa; padding: 2rem 1rem;
    }
    .wrapper { max-width: 860px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; }
    .header { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; padding: 2.5rem 2.5rem 2rem; }
    .header .badge { display: inline-block; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 12px; margin-bottom: 1rem; color: #c8d6ff; }
    .header h1 { font-size: 1.6rem; font-weight: 700; line-height: 1.3; margin-bottom: 0.5rem; }
    .header .meta { font-size: 13px; color: rgba(255,255,255,0.6); }
    .header .meta span { margin-right: 1.5rem; }
    .body { padding: 2.5rem; }
    p { margin-bottom: 1rem; color: #2d2d44; }
    h2 { font-size: 1.15rem; font-weight: 700; color: #0f0c29; margin: 2.5rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 2px solid #e8eaf6; }
    h3 { font-size: 1rem; font-weight: 700; color: #302b63; margin: 2rem 0 0.6rem; }
    h4 { font-size: 0.92rem; font-weight: 600; color: #555; margin: 1.5rem 0 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .callout { border-left: 4px solid #5c6bc0; background: #f0f2ff; border-radius: 0 8px 8px 0; padding: 1rem 1.25rem; margin: 1.25rem 0; color: #2d2d44; }
    .callout.warn { border-color: #f57c00; background: #fff8f0; }
    .callout.success { border-color: #2e7d32; background: #f0faf0; }
    .table-wrap { overflow-x: auto; margin: 1.25rem 0; border-radius: 8px; border: 1px solid #e0e3f0; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    thead tr { background: #302b63; color: #fff; }
    thead th { padding: 10px 14px; text-align: left; font-weight: 600; }
    tbody tr:nth-child(even) { background: #f7f8fd; }
    tbody tr:hover { background: #eef0fb; }
    tbody td { padding: 9px 14px; border-bottom: 1px solid #e8eaf6; vertical-align: top; }
    tbody tr:last-child td { border-bottom: none; }
    .highlight-row td { font-weight: 700; background: #e8eaf6 !important; }
    code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; background: #eef0fb; border: 1px solid #d0d4f0; border-radius: 4px; padding: 1px 5px; color: #302b63; }
    .asks { list-style: none; counter-reset: asks; margin: 1rem 0; }
    .asks li { counter-increment: asks; display: flex; gap: 1rem; margin-bottom: 1rem; align-items: flex-start; }
    .asks li::before { content: counter(asks); flex-shrink: 0; width: 28px; height: 28px; background: #302b63; color: #fff; border-radius: 50%; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
    .asks li p { margin: 0; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin: 1.25rem 0; }
    .stat-card { background: #f0f2ff; border: 1px solid #d0d4f0; border-radius: 10px; padding: 1rem 1.25rem; text-align: center; }
    .stat-card .value { font-size: 1.5rem; font-weight: 800; color: #302b63; line-height: 1.2; }
    .stat-card .label { font-size: 11.5px; color: #666; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .footer { background: #f7f8fd; border-top: 1px solid #e0e3f0; padding: 1.5rem 2.5rem; font-size: 13px; color: #666; }
    .attachments { list-style: none; margin: 0.75rem 0; }
    .attachments li { display: flex; align-items: center; gap: 0.5rem; padding: 6px 0; font-size: 13.5px; border-bottom: 1px solid #eee; }
    .attachments li:last-child { border-bottom: none; }
    .attachments li::before { content: "📎"; font-size: 14px; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="badge">{{BADGE_TEXT}}</div>
    <h1>{{REPORT_TITLE}}</h1>
    <div class="meta">
      <span>📅 {{DATE}}</span>
      <span>📋 {{PLAN}}</span>
      <span>💳 {{TOTAL_CREDITS}} credits used</span>
      <span>To: {{RECIPIENT}}</span>
    </div>
  </div>
  <div class="body">
    <!-- BODY CONTENT INJECTED HERE -->
    {{BODY_CONTENT}}
  </div>
  <div class="footer">
    <strong>{{USER_NAME}}</strong> · {{PLAN}} · {{TOTAL_CREDITS}} credits used<br>
    Projects: {{PROJECT_LIST}}
    <div style="margin-top:0.75rem; color:#999; font-size:12px;">Prepared {{DATE}} · In reply to {{RECIPIENT}}</div>
  </div>
</div>
</body>
</html>
