<?xml version="1.0" encoding="UTF-8"?>
<!--
  Geeves.Life — Universal Logo
  Transparent background. Works on ANY surface: dark, light, coloured.

  Technique for "Geeves." (white text):
  • paint-order: stroke fill  →  black stroke drawn BEHIND white fill
  • stroke-width: 16px black, opacity 0.80  →  visible dark outline on white bg
  • feDropShadow (stdDeviation 8, opacity 0.70)  →  soft outer glow for extra depth
  • On dark backgrounds: black stroke blends into dark bg, white fill reads perfectly
  • On white backgrounds: black stroke + shadow create contrast, white fill pops

  "Life" uses brand teal — readable on any surface, light shadow only.
  Constellation mark: pure brand palette, no text tricks needed.
  All geometry is pure SVG — infinitely scalable.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 960 960" width="960" height="960">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;800&amp;display=swap');
      .wm  { font-family: "Nunito", "Trebuchet MS", Arial, sans-serif; font-weight: 800; font-size: 112px; }
      .tag { font-family: "Nunito", "Trebuchet MS", Arial, sans-serif; font-weight: 300; font-size: 27px; letter-spacing: 8px; }
    </style>

    <!-- Outer soft shadow applied to the whole wordmark group -->
    <filter id="shadow-outer" x="-25%" y="-55%" width="150%" height="210%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Lighter shadow for teal "Life" -->
    <filter id="shadow-life" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="5" flood-color="#000000" flood-opacity="0.40"/>
    </filter>

    <!-- Tagline shadow -->
    <filter id="shadow-tag" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ════════════════════════════════════════════
       CONSTELLATION MARK  (centred at x=480)
       ════════════════════════════════════════════ -->

  <!-- Roof lines -->
  <line x1="480" y1="105" x2="302" y2="228" stroke="#2AAFA9" stroke-width="7" stroke-linecap="round"/>
  <line x1="480" y1="105" x2="658" y2="228" stroke="#2AAFA9" stroke-width="7" stroke-linecap="round"/>

  <!-- Verticals -->
  <line x1="302" y1="228" x2="302" y2="430" stroke="#E8624A" stroke-width="7" stroke-linecap="round"/>
  <line x1="658" y1="228" x2="658" y2="430" stroke="#D4A017" stroke-width="7" stroke-linecap="round"/>

  <!-- Base horizontals -->
  <line x1="302" y1="430" x2="410" y2="430" stroke="#8B5CF6" stroke-width="7" stroke-linecap="round"/>
  <line x1="550" y1="430" x2="658" y2="430" stroke="#4F7EC4" stroke-width="7" stroke-linecap="round"/>

  <!-- Arch -->
  <path d="M 410,430 L 410,368 C 410,334.863 438.654,308 480,308 C 521.346,308 550,334.863 550,368 L 550,430"
        fill="none" stroke="#2AAFA9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="480" y1="308" x2="480" y2="430" stroke="#2AAFA9" stroke-width="7" stroke-linecap="round"/>
  <line x1="480" y1="430" x2="480" y2="520" stroke="#E8943A" stroke-width="7" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="480" cy="105" r="32" fill="#2AAFA9"/>
  <circle cx="302" cy="228" r="26" fill="#E8624A"/>
  <circle cx="658" cy="228" r="26" fill="#D4A017"/>
  <circle cx="480" cy="308" r="20" fill="#2AAFA9"/>
  <circle cx="302" cy="430" r="26" fill="#8B5CF6"/>
  <circle cx="658" cy="430" r="26" fill="#4F7EC4"/>
  <circle cx="480" cy="520" r="22" fill="none" stroke="#E8943A" stroke-width="7"/>

  <!-- ════════════════════════════════════════════
       WORDMARK
       "Geeves." — white fill, black stroke behind (paint-order: stroke fill)
       "Life"    — teal fill, light shadow
       ════════════════════════════════════════════ -->

  <!-- "Geeves." — stroke drawn behind fill for universal contrast -->
  <text class="wm" x="478" y="720" text-anchor="end"
        fill="#FFFFFF"
        stroke="#000000" stroke-width="3" stroke-opacity="0.78"
        stroke-linejoin="round"
        paint-order="stroke fill"
        filter="url(#shadow-outer)">Geeves.</text>

  <!-- "Life" — brand teal with light shadow -->
  <text class="wm" x="482" y="720" text-anchor="start"
        fill="#2AAFA9"
        filter="url(#shadow-life)">Life</text>

  <!-- ════════════════════════════════════════════
       TAGLINE
       ════════════════════════════════════════════ -->
  <text class="tag" x="480" y="768" text-anchor="middle"
        fill="#9CA3AF"
        filter="url(#shadow-tag)">OPERATING SYSTEM</text>

</svg>
